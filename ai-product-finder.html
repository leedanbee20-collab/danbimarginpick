<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANBI AI 상품찾기</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#fff7fb;
  color:#222;
}
.wrap{
  max-width:720px;
  margin:auto;
  padding:25px 18px 50px;
}
h1{
  font-size:30px;
  margin:5px 0 8px;
}
.sub{
  color:#666;
  line-height:1.6;
  margin-bottom:22px;
}
.card{
  background:white;
  border:1px solid #f2dce7;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(255,80,150,.06);
}
h2{
  margin:0 0 16px;
  font-size:21px;
}
.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.cat{
  border:1px solid #f0d4e1;
  background:#fff;
  border-radius:15px;
  padding:15px 8px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.cat.active{
  background:#fff0f6;
  border:2px solid #ff3f91;
  color:#d81b68;
}
input{
  width:100%;
  padding:16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:17px;
  margin-top:12px;
}
.mainbtn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:17px;
  margin-top:12px;
  background:#ff3f91;
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.result{
  display:none;
  background:#fff0f6;
  border-radius:18px;
  padding:18px;
  margin-top:17px;
  line-height:1.7;
}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.chip{
  background:white;
  border:1px solid #efcbdc;
  border-radius:30px;
  padding:9px 12px;
  cursor:pointer;
}
.malls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.mall{
  border:1px solid #f0d4e1;
  background:white;
  border-radius:15px;
  padding:14px 5px;
  font-weight:800;
  cursor:pointer;
}
.back{
  display:block;
  text-align:center;
  margin-top:22px;
  text-decoration:none;
  color:#777;
  font-weight:700;
}
.small{
  color:#777;
  font-size:14px;
  margin-top:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🤖 AI 상품찾기</h1>
<div class="sub">
팔고 싶은 상품군을 고르면 소싱하기 좋은 상품 아이디어를 빠르게 찾아드려요.
</div>

<div class="card">
<h2>① 상품군 선택</h2>

<div class="categories">
<button class="cat" onclick="pick('과일·농산물',this)">🍎 과일·농산물</button>
<button class="cat" onclick="pick('식품·간식',this)">🥐 식품·간식</button>
<button class="cat" onclick="pick('생활용품',this)">🏠 생활용품</button>
<button class="cat" onclick="pick('주방용품',this)">🍳 주방용품</button>
<button class="cat" onclick="pick('뷰티·화장품',this)">💄 뷰티·화장품</button>
<button class="cat" onclick="pick('건강용품',this)">💪 건강용품</button>
<button class="cat" onclick="pick('패션·잡화',this)">👜 패션·잡화</button>
<button class="cat" onclick="pick('반려동물',this)">🐶 반려동물</button>
</div>
</div>

<div class="card">
<h2>② AI에게 상품 찾기</h2>

<input id="keyword"
placeholder="예: 명절선물, 40대 여성, 자취생">

<button class="mainbtn" onclick="findProducts()">
✨ AI 상품 후보 찾기
</button>

<div id="result" class="result"></div>
</div>

<div class="card">
<h2>③ 같은 상품 가격 비교</h2>

<input id="search"
placeholder="비교할 상품명을 입력하세요">

<div class="malls">
<button class="mall" onclick="mall('coupang')">쿠팡</button>
<button class="mall" onclick="mall('gmarket')">G마켓</button>
<button class="mall" onclick="mall('auction')">옥션</button>
<button class="mall" onclick="mall('11st')">11번가</button>
<button class="mall" onclick="mall('naver')">네이버쇼핑</button>
</div>

<div class="small">
상품 후보를 누르면 자동으로 비교 검색창에 들어갑니다.
여러 쇼핑몰의 가격을 비교한 뒤 마진픽에서 수익을 계산하세요.
</div>
</div>

<a class="back" href="index.html">
← DANBI MARGINPICK으로 돌아가기
</a>

</div>

<script>

let category="";

const ideas={
"과일·농산물":[
"사과 선물세트",
"샤인머스켓",
"곶감 선물세트",
"제주 감귤",
"고구마 5kg"
],

"식품·간식":[
"견과류 선물세트",
"약과 세트",
"한과 선물세트",
"프로틴 간식",
"수제 쿠키세트"
],

"생활용품":[
"호텔수건 세트",
"대용량 물티슈",
"세탁세제 세트",
"욕실 청소용품",
"수납 정리함"
],

"주방용품":[
"밀폐용기 세트",
"프라이팬 세트",
"텀블러",
"주방 수납선반",
"실리콘 조리도구"
],

"뷰티·화장품":[
"멀티밤",
"마스크팩 세트",
"선크림",
"보습크림",
"클렌징 세트"
],

"건강용품":[
"마사지볼",
"찜질팩",
"손목 보호대",
"목 스트레칭기",
"건강 선물세트"
],

"패션·잡화":[
"여성 운동화",
"여성 크로스백",
"여름 모자",
"파우치 세트",
"기능성 양말"
],

"반려동물":[
"강아지 간식",
"고양이 모래",
"반려동물 방석",
"강아지 배변패드",
"반려동물 장난감"
]
};

function pick(name,btn){

category=name;

document.querySelectorAll(".cat")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

}

function findProducts(){

if(!category){
alert("먼저 상품군을 선택해주세요.");
return;
}

let extra=document.getElementById("keyword").value.trim();

let list=ideas[category];

let html=
"<b>🔎 AI 소싱 후보</b><br>"+
"<b>"+category+"</b>";

if(extra){
html+=" · "+safe(extra);
}

html+=
"<br><br>아래 상품 중 하나를 눌러 가격 비교를 시작하세요."+
"<div class='chips'>";

list.forEach(function(item){

html+=
"<button class='chip' onclick='selectProduct(\""+
item.replace(/"/g,"&quot;")+
"\")'>"+item+"</button>";

});

html+="</div>";

let r=document.getElementById("result");

r.innerHTML=html;
r.style.display="block";

}

function selectProduct(name){

document.getElementById("search").value=name;

document.getElementById("search")
.scrollIntoView({behavior:"smooth",block:"center"});

}

function mall(type){

let q=document.getElementById("search").value.trim();

if(!q){
alert("비교할 상품명을 먼저 입력해주세요.");
return;
}

let e=encodeURIComponent(q);
let url="";

if(type==="coupang")
url="https://www.coupang.com/np/search?q="+e;

if(type==="gmarket")
url="https://browse.gmarket.co.kr/search?keyword="+e;

if(type==="auction")
url="https://browse.auction.co.kr/search?keyword="+e;

if(type==="11st")
url="https://search.11st.co.kr/Search.tmall?kwd="+e;

if(type==="naver")
url="https://search.shopping.naver.com/search/all?query="+e;

window.open(url,"_blank");

}

function safe(text){

let d=document.createElement("div");
d.textContent=text;

return d.innerHTML;

}

</script>

</body>
</html>
