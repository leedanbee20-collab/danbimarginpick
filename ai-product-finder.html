<title>DANBI AI 상품찾기</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#fff7fb;
  color:#222;
}
.wrap{
  max-width:720px;
  margin:auto;
  padding:25px 18px 50px;
}
h1{
  font-size:30px;

.sub{

}
.card{

  box-shadow:0 5px 18px rgba(255,80,150,.06);
}
h2{

  font-size:21px;
}
.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.cat{
  border:1px solid #f0d4e1;

  border-radius:15px;
  padding:15px 8px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

}

  padding:16px;

  border-radius:14px;
  font-size:17px;
  margin-top:12px;
}
.mainbtn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:17px;
  margin-top:12px;
  background:#ff3f91;
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.result{
  display:none;
  background:#fff0f6;
  border-radius:18px;
  padding:18px;
  margin-top:17px;
  line-height:1.7;
}
.chips{

  gap:8px;
  margin-top:12px;
}
.chip{
  background:white;
  border:1px solid #efcbdc;

  font-size:14px;
}

}

.tag{

  margin:3px;
  font-size:12px;

  gap:10px;
  margin-top:15px;
}

function pick(name,btn){

category=name;

document.querySelectorAll(".cat")
.forEach(function(x){
x.classList.remove("active");
});

btn.classList.add("active");

}


function getIntent(text){

text=(text || "").toLowerCase();

if(
text.includes("명절") ||
text.includes("선물") ||
text.includes("부모님") ||
text.includes("추석") ||
text.includes("설날")
){
return "gift";
}

if(
text.includes("자취") ||
text.includes("1인") ||
text.includes("혼자") ||
text.includes("소포장")
){
return "single";
}

if(
text.includes("40대") ||
text.includes("50대") ||
text.includes("60대") ||
text.includes("여성") ||
text.includes("엄마")
){
return "women";
}

if(
text.includes("가성비") ||
text.includes("저렴") ||
text.includes("싼") ||
text.includes("대용량") ||
text.includes("마진")
){
return "value";
}

return "default";

}


function getIntentName(intent){

if(intent==="gift") return "선물·명절형";
if(intent==="single") return "1인·자취형";
if(intent==="women") return "여성 타깃형";
if(intent==="value") return "가성비·마진형";

return "기본 인기형";

}


function getProducts(category,intent){

let data=productDB[category];

if(!data){
return [];
}

let list=data[intent];

if(!list){
list=data.default;
}

let combined=[].concat(list || []);

if(intent!=="default" && data.default){
combined=combined.concat(data.default);
}

let unique=[];

combined.forEach(function(item){

if(!unique.includes(item)){
unique.push(item);
}

});

return unique.slice(0,8);

}


function findProducts(){

if(!category){

alert("먼저 상품군을 선택해주세요.");

return;

}

let extra=
document.getElementById("keyword").value.trim();

let intent=getIntent(extra);

let list=getProducts(category,intent);

if(list.length===0){

alert("추천 상품을 찾지 못했습니다.");

return;

}

let html=
"<b>✨ AI 소싱 추천</b><br>"+
"<b>"+safe(category)+"</b>";

if(extra){

html+=" · "+safe(extra);

}

html+=
"<div class='aiinfo'>"+
"<span class='tag'>"+getIntentName(intent)+"</span>"+
"<br>현재 입력 조건을 기준으로 비교하기 좋은 상품 후보를 골랐어요."+
"<br><b>상품을 누르면 아래 가격비교 검색창에 자동 입력됩니다.</b>"+
"</div>"+
"<div class='chips'>";


list.forEach(function(item){

html+=
"<button class='chip' type='button' data-product='"+
safe(item)+
"'>"+
safe(item)+
"</button>";

});


html+="</div>";


let result=
document.getElementById("result");

result.innerHTML=html;

result.style.display="block";


result.querySelectorAll(".chip")
.forEach(function(button){

button.addEventListener("click",function(){

selectProduct(
this.getAttribute("data-product")
);

});

});

}


function selectProduct(name){

document.getElementById("search").value=name;

document.getElementById("search")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

}


function mall(type){

let q=
document.getElementById("search").value.trim();

if(!q){

alert("비교할 상품명을 먼저 입력해주세요.");

return;

}

let e=encodeURIComponent(q);

let url="";


if(type==="coupang"){

url=
"https://www.coupang.com/np/search?q="+e;

}

else if(type==="gmarket"){

url=
"https://browse.gmarket.co.kr/search?keyword="+e;

}

else if(type==="auction"){

url=
"https://browse.auction.co.kr/search?keyword="+e;

}

else if(type==="11st"){

url=
"https://search.11st.co.kr/Search.tmall?kwd="+e;

}

else if(type==="naver"){

url=
"https://search.shopping.naver.com/search/all?query="+e;

}


if(url){

window.open(url,"_blank");

}

}


function safe(text){

let d=document.createElement("div");

d.textContent=text;

return d.innerHTML;

}

</script>
